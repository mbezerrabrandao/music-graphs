      - data/interim/acoustic/acousticbrainz_fetch_manifest.csv
      - data/processed/acoustic_graphs/top10_knn20_min0_40/graph_largest_component.graphml
      - data/processed/acoustic_graphs/top10_knn20_min0_40/graph_acoustic_summary.json
      - data/processed/acoustic_graphs/top10_knn20_min0_40/graph_acoustic_threshold_sensitivity.csv
      - data/processed/acoustic_graphs/top10_knn20_min0_40/graph_acoustic_knn_threshold_sensitivity.csv

  run_acoustic_modularity_baselines:
    enabled: true
