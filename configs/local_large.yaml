      - "44"
      - "45"
      - "46"
      - --k-values
      - "25"
      - "40"
      - "54"
      - "75"
      - "100"
      - "150"
      - --dimensions
      - "64"
      - --walk-length
      - "40"
      - --walks-per-node
      - "10"
      - --context-window
      - "5"
      - --epochs
      - "30"
    inputs:
      - data/processed/acoustic_graphs/top10_knn20_min0_40/graph_largest_component.graphml
      - data/interim/musicbrainz/largest_component_genre_coverage.csv
    outputs:
