project:
  name: music-artist-graphs
  mode: tune
  state_dir: results/.pipeline_state_local_large
  selection_report: results/selection_report_local_large.md

paths:
  lastfm_export_dir: data/raw/lastfm

optional:
  semantic_reference: false
  gae: true
  acoustic_reference: true
  ablations: false

parameters:
  sessions:
    threshold_minutes: 60
  behavioral_graph:
    relation_mode: sequential
    window_size_scrobbles: 5
    minimum_shared_sessions: 2
    edge_weight: multi_user_decayed_shared_session_cosine
    minimum_artist_scrobbles: 3
    use_largest_connected_component: true
  modularity:
    resolutions: [0.5, 0.75, 1.0, 1.25, 1.5, 2.0, 2.25, 2.5, 3.0, 4.0]
    balanced_resolution: 2.25
    granular_resolution: 4.0
    seeds: [42, 43, 44, 45, 46]
  node2vec:
    dimensions: 64
    walk_length: 40
    walks_per_node: 10
    context_window: 5
    epochs: 30
    p_values: [0.5, 1.0, 2.0]
    q_values: [0.5, 1.0, 2.0]
    selected_p: 2.0
    selected_q: 1.0
    balanced_k: 54
    seeds: [42, 43, 44, 45, 46]
  smooth_controls:
    modes: [raw, smooth1, smooth2]
    balanced_k: 54
    seeds: [42, 43, 44, 45, 46]
  genre_inference:
    families: [raw, smooth1, smooth2, node2vec, gae, acoustic_raw, acoustic_smooth1, acoustic_smooth2, acoustic_node2vec, acoustic_gae]
    classifier: logistic_regression
    class_weight: balanced
    regularization_c_grid: [0.01, 0.1, 1.0, 10.0, 100.0]
    minimum_genre_support: 5
    cv_folds: 5
    cv_seeds: [42, 43, 44, 45, 46]
    primary_metric: macro_f1

stages:
  audit_export:
    enabled: true
    command:
      - "{python}"
      - src/music_graphs/data/inspect_lastfm_export.py
      - data/raw/lastfm
      - --output-dir
      - results/data_audit
    inputs:
      - data/raw/lastfm
    outputs:
      - results/data_audit

  canonicalize:
    enabled: true
    command:
      - "{python}"
      - src/music_graphs/data/build_canonical_tables.py
      - data/raw/lastfm
      - --output-dir
      - data/interim
    inputs:
      - data/raw/lastfm
    outputs:
      - data/interim/canonical_scrobbles.csv
      - data/interim/canonical_artists.csv

  session_audit:
    enabled: true
    command:
      - "{python}"
      - src/music_graphs/data/analyze_session_thresholds.py
      - data/interim/canonical_scrobbles.csv
      - --output-dir
      - results/session_audit
      - --thresholds
      - "15"
      - "30"
      - "45"
      - "60"
      - "90"
      - "120"
    inputs:
      - data/interim/canonical_scrobbles.csv
    outputs:
      - results/session_audit/inter_scrobble_gap_quantiles.csv
      - results/session_audit/session_threshold_sensitivity.csv

  select_session_threshold:
    enabled: true
    command:
      - "{python}"
      - src/music_graphs/evaluation/select_session_threshold.py
      - results/session_audit/inter_scrobble_gap_quantiles.csv
      - --output-dir
      - results/selection_evidence
      - --candidates
      - "15"
      - "30"
      - "45"
      - "60"
      - "90"
      - "120"
      - --expected-selected
      - "45"
      - --allow-new-selection
    inputs:
      - results/session_audit/inter_scrobble_gap_quantiles.csv
    outputs:
      - results/selection_evidence/session_threshold_selection.json
      - results/selection_evidence/session_threshold_selection.md

  build_sessions:
    enabled: true
    command:
      - "{python}"
      - src/music_graphs/data/build_listening_sessions.py
      - data/interim/canonical_scrobbles.csv
      - --output-root
      - data/interim/sessions
      - --threshold-minutes
      - "60"
      - --long-session-minutes
      - "480"
    inputs:
      - data/interim/canonical_scrobbles.csv
      - results/selection_evidence/session_threshold_selection.json
    outputs:
      - data/interim/sessions/threshold_60m/scrobbles_with_sessions.csv
      - data/interim/sessions/threshold_60m/listening_sessions.csv

  build_behavioral_graph:
    enabled: true
    command:
      - "{python}"
      - src/music_graphs/graphs/run_behavioral_graph_pipeline.py
      - data/interim/sessions/threshold_60m/scrobbles_with_sessions.csv
      - --edge-output-root
      - data/interim/listening_graphs
      - --processed-output-dir
      - data/processed/listening_graphs/sequential_k5_decay_support2_min3
      - --mode
      - sequential
      - --window-size
      - "5"
      - --k-sensitivity-values
      - "1"
      - "2"
      - "3"
      - "5"
      - "10"
      - --min-shared-session-thresholds
      - "1"
      - "2"
      - "3"
      - "5"
      - "10"
      - --progress-every
      - "1000"
      - --min-scrobbles
      - "3"
      - --min-shared-sessions
      - "2"
      - --weight-column
      - multi_user_decayed_shared_session_cosine
    inputs:
      - data/interim/sessions/threshold_60m/scrobbles_with_sessions.csv
    outputs:
      - data/interim/listening_graphs/sequential_k5/min_shared_sessions_sensitivity.csv
      - data/processed/listening_graphs/sequential_k5_decay_support2_min3/graph_largest_component.graphml
      - data/processed/listening_graphs/sequential_k5_decay_support2_min3/nodes_largest_component.csv

  summarize_graph_support:
    enabled: true
    command:
      - "{python}"
      - src/music_graphs/evaluation/summarize_graph_support.py
      - data/interim/listening_graphs/sequential_k5/min_shared_sessions_sensitivity.csv
      - --output-dir
      - results/selection_evidence
      - --selected-support
      - "2"
    inputs:
      - data/interim/listening_graphs/sequential_k5/min_shared_sessions_sensitivity.csv
    outputs:
      - results/selection_evidence/graph_support_selection.json
      - results/selection_evidence/graph_support_selection.md

  fetch_musicbrainz:
    enabled: true
    command:
      - "{python}"
      - src/music_graphs/data/run_musicbrainz_fetch.py
      - data/interim/canonical_artists.csv
      - --cache-dir
      - data/raw/musicbrainz/artist_genres
      - --output-dir
      - data/interim/musicbrainz
      - --delay-seconds
      - "1.1"
      - --max-retries
      - "4"
      - --save-progress-every
      - "25"
    inputs:
      - data/interim/canonical_artists.csv
    outputs:
      - data/interim/musicbrainz/artist_genre_fetch_manifest.csv

  prepare_genre_labels:
    enabled: true
    command:
      - "{python}"
      - src/music_graphs/data/build_musicbrainz_genre_tables.py
      - data/interim/canonical_artists.csv
      - --cache-dir
      - data/raw/musicbrainz/artist_genres
      - --output-dir
      - data/interim/musicbrainz
      - --graph-nodes-csv
      - data/processed/listening_graphs/sequential_k5_decay_support2_min3/nodes_largest_component.csv
    inputs:
      - data/interim/canonical_artists.csv
      - data/interim/musicbrainz/artist_genre_fetch_manifest.csv
      - data/processed/listening_graphs/sequential_k5_decay_support2_min3/nodes_largest_component.csv
    outputs:
      - data/interim/musicbrainz/largest_component_genre_coverage.csv
      - data/interim/musicbrainz/artist_genres_long.csv

  build_acoustic_graph:
    enabled: true
    command:
      - "{python}"
      - src/music_graphs/graphs/build_acoustic_artist_graph.py
      - data/interim/canonical_scrobbles.csv
      - data/interim/musicbrainz/largest_component_genre_coverage.csv
      - --recordings-csv
      - data/interim/acoustic/top_artist_recordings_top10.csv
      - --cache-dir
      - data/raw/acousticbrainz/low_level
      - --fetch-manifest-csv
      - data/interim/acoustic/acousticbrainz_fetch_manifest.csv
      - --artist-features-csv
      - data/interim/acoustic/artist_acoustic_features_top10.csv
      - --output-dir
      - data/processed/acoustic_graphs/top10_knn20_min0_40
      - --top-n
      - "10"
      - --min-track-scrobbles
      - "2"
      - --min-recordings-per-artist
      - "1"
      - --nearest-neighbors
      - "20"
      - --min-similarity
      - "0.40"
      - --sensitivity-thresholds
      - "0.30"
      - "0.35"
      - "0.40"
      - "0.45"
      - "0.50"
      - "0.60"
      - --sensitivity-neighbors
      - "10"
      - "20"
      - "30"
      - "50"
      - --batch-size
      - "20"
      - --sleep-seconds
      - "1.0"
    inputs:
      - data/interim/canonical_scrobbles.csv
      - data/interim/musicbrainz/largest_component_genre_coverage.csv
    outputs:
