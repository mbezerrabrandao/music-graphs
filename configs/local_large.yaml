decisions:
  - decision: session_threshold_minutes
    status: computed_and_validated
    candidates: [15, 30, 45, 60, 90, 120]
    selected: 60
    selection_rule: Closest tested threshold to the p95 inter-scrobble gap.
    uses_external_genres: false

  - decision: behavioral_relation_mode
    status: frozen_after_methodological_comparison
    candidates: [sequential_k5, temporal_30m]
    selected: sequential_k5
    selection_rule: Prefer a bounded local context that limits long-session effects while preserving a sufficiently large connected graph.
    uses_external_genres: false

  - decision: minimum_shared_sessions
    status: reported_and_validated
    candidates: [1, 2, 3, 5, 10]
    selected: 2
    selection_rule: Require repeated co-occurrence while retaining a broad active graph and a dominant connected component.
    uses_external_genres: false

  - decision: behavioral_edge_weight
    status: frozen
    selected: multi_user_decayed_shared_session_cosine
    selection_rule: Normalize repeated shared-session evidence while strengthening relations independently observed across multiple users.
    uses_external_genres: false

  - decision: minimum_artist_scrobbles
    status: frozen
    selected: 3
    selection_rule: Exclude extremely sparse artist activity while retaining the broad behavioral graph.
    uses_external_genres: false

  - decision: modularity_balanced_resolution
    status: frozen_after_exploratory_analysis
    selected: 2.25
    selection_rule: Report the exploratory structural-versus-semantic trade-off transparently. Do not automatically optimize resolution against genres for a new user history.
    uses_external_genres: true

  - decision: node2vec_balanced_k
    status: balanced_scale_with_sensitivity
    candidates: [25, 40, 54, 75, 100, 150]
    selected: 54
    selection_rule: Keep k=54 as the balanced downstream scale while reporting cluster-count sensitivity across the tested candidate grid.
    uses_external_genres: false

  - decision: node2vec_walk_bias
    status: computed_and_validated
    candidates:
      p: [0.5, 1.0, 2.0]
      q: [0.5, 1.0, 2.0]
      seeds: [42, 43, 44, 45, 46]
    selected: {p: 2.0, q: 1.0}
    selection_rule: Maximum mean silhouette across five seeds within the balanced k=54 scale.
    uses_external_genres: false

  - decision: acoustic_node2vec_walk_bias
    status: computed_and_validated
    candidates:
      p: [0.5, 1.0, 2.0]
      q: [0.5, 1.0, 2.0]
      seeds: [42, 43, 44, 45, 46]
    selected: {p: 2.0, q: 2.0}
    selection_rule: Maximum mean silhouette across five seeds within the balanced k=54 scale, independently on the acoustic graph.
    uses_external_genres: false

  - decision: acoustic_graph_reference
    status: exploratory_reference_graph
    candidates:
      top_n_recordings: [5, 10]
      nearest_neighbors: [10, 20, 30, 50]
      min_similarity: [0.30, 0.35, 0.40, 0.45, 0.50, 0.60]
    selected:
      top_n_recordings: 10
      nearest_neighbors: 20
      min_similarity: 0.40
    selection_rule: Use top listened recordings with cached low-level AcousticBrainz coverage, report kNN-by-threshold sensitivity, and retain kNN=20 with min_similarity=0.40 as the acoustic reference graph because it preserves top-artist connectivity while avoiding the most permissive edges.
    uses_external_genres: false

  - decision: graph_autoencoder_hyperparameters
    status: computed_with_k_sensitivity
    candidates:
      hidden_dim: [128]
      latent_dim: [16, 32]
      dropout: [0.1, 0.3]
      learning_rate: [0.005, 0.001]
      weight_decay: [0.0001]
      k: [25, 40, 54, 75, 100, 150]
      seeds: [42, 43, 44, 45, 46]
    selected: computed_from_validation_auc_and_reported_k_grid
    selection_rule: Select the embedding hyperparameters by held-out edge reconstruction validation AUC, then report K-Means cluster-count sensitivity on the selected embeddings.
    uses_external_genres: false

  - decision: downstream_genre_inference_representation
    status: computed_after_unsupervised_freeze
    candidates: [raw, smooth1, smooth2, node2vec, gae, acoustic_raw, acoustic_smooth1, acoustic_smooth2, acoustic_node2vec, acoustic_gae]
    selected: computed_from_current_run
    selection_rule: Highest mean macro-F1 under repeated stratified cross-validation after freezing the unsupervised behavioral and acoustic representation grids.
    uses_external_genres: true

