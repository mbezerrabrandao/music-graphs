project:
  name: music-artist-graphs
  mode: tune
  state_dir: results/.pipeline_state_tune
  selection_report: results/selection_report_tune.md

paths:
  lastfm_export_dir: data/raw/lastfm

optional:
  semantic_reference: false
  gae: false
  ablations: false

tuning:
  sessions:
    threshold_minutes: [15, 30, 45, 60, 90, 120]
    selection_rule: closest_tested_threshold_to_p95_gap
  behavioral_graph:
    relation_modes: [sequential_k5, temporal_30m]
    minimum_shared_sessions: [1, 2, 3, 5, 10]
  modularity:
    resolutions: [0.5, 0.75, 1.0, 1.25, 1.5, 2.0, 2.25, 2.5, 3.0, 4.0]
    automatic_selection: false
    report: [modularity, stability, community_count, singleton_count, size_distribution]
  node2vec:
    p: [0.5, 1.0, 2.0]
    q: [0.5, 1.0, 2.0]
    balanced_k: 54
    seeds: [42, 43, 44, 45, 46]
    selection_rule: maximum_mean_silhouette_within_balanced_scale

# Copy wired commands from paper.yaml after stage mapping.
stages: {}

decisions:
  - decision: tune_mode_policy
    status: active
    selected: report_structural_evidence_before_freezing_parameters
    selection_rule: Do not automatically optimize community-detection resolution against external genres for a new user history.
    uses_external_genres: false
